<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lama Elizabeth Monson</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --forest:#1d2e22;
  --forest-deep:#162018;
  --forest-mid:#22382a;
  --paper:#ece5d2;
  --paper-dim:#cfc6ad;
  --ink:#0e150f;
  --gold:#d2a35c;
  --rust:#b8643a;
  --serif:'EB Garamond',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --pad-y:7rem;
  --gut:5vw;
  --rule:rgba(236,229,210,.18);
}
[data-density="airy"]{ --pad-y:9rem; }
[data-density="tight"]{ --pad-y:4.5rem; }

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--forest);color:var(--paper);font-family:var(--serif);font-size:18px;line-height:1.55;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono,.mono *{font-family:var(--mono);font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;font-weight:400}
em{font-style:italic}

/* ── header ── */
.site-header{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:1.4rem var(--gut);
  background:linear-gradient(to bottom, var(--forest) 75%, transparent);
  backdrop-filter:blur(2px);
}
.wordmark{display:flex;flex-direction:column;line-height:1;letter-spacing:.01em}
.wm-line{font-family:var(--mono);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--paper-dim);margin-bottom:.3rem}
.wm-name{font-family:var(--serif);font-size:1.25rem;font-style:italic;white-space:nowrap}
.site-header{gap:2.4rem}
.nav{display:flex;gap:1.4rem;flex-wrap:wrap;justify-content:flex-end}
.nav-link{position:relative;font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;padding:.4rem 0;color:var(--paper-dim);transition:color .3s}
.nav-link:hover,.nav-link.is-current{color:var(--paper)}
.nav-link.is-current::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--gold)}
.nav-num{font-size:.6rem;color:var(--gold);margin-right:.4rem;opacity:.7}
.nav-toggle{display:none;flex-direction:column;gap:5px;padding:.6rem}
.nav-toggle span{display:block;width:22px;height:1px;background:var(--paper)}

/* ── main + page ── */
.site-main{padding:0 var(--gut) var(--pad-y);min-height:70vh}
.fade-in{animation:fade .6s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.page{max-width:1280px;margin:0 auto;padding-top:3rem}
.page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:2rem;padding-bottom:2.4rem;border-bottom:1px solid var(--rule);margin-bottom:3.5rem}
.pt-eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-dim)}
.page-title h1{font-size:clamp(2.2rem,5vw,4.2rem);font-weight:400;line-height:1.05;letter-spacing:-.01em;text-wrap:balance;flex:1}
.page-lede{font-size:1.3rem;font-style:italic;max-width:48ch;color:var(--paper-dim);margin-bottom:3rem;line-height:1.4}

/* ── home: editorial (reference-style) ── */
.home-editorial{position:relative;padding-top:1rem;min-height:80vh}
.he-photo{position:absolute;top:0;right:0;width:42vw;max-width:680px;aspect-ratio:5/4;overflow:hidden}
.he-photo img{width:100%;height:100%;object-fit:cover;filter:saturate(.92) contrast(1.02)}
.he-photo-cap{position:absolute;bottom:.6rem;left:.8rem;font-family:var(--mono);font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:#f5efdc;background:rgba(15,28,20,.55);padding:.3rem .55rem;backdrop-filter:blur(2px)}
.he-leaf{position:absolute;top:.5rem;left:0;width:90px;color:var(--paper);opacity:.45}
.he-manifesto{margin-top:min(46vh,520px);padding-top:3rem;max-width:60ch;font-size:clamp(1.5rem,3vw,2.4rem);font-style:italic;line-height:1.3;letter-spacing:-.005em;color:var(--paper)}
.home-editorial .featured-row{margin-top:5rem}

/* ── home: manuscript ── */
.home-manuscript{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6vh}
.hm-frame{max-width:920px}
.hm-glyph{font-size:3rem;color:var(--gold);margin-bottom:2.5rem;line-height:1}
.hm-title{font-size:clamp(2.2rem,5.5vw,4.6rem);font-weight:400;line-height:1.08;letter-spacing:-.015em}
.hm-title span{display:block}
.hm-amp{font-style:italic;color:var(--gold);font-size:.6em;margin:.3rem 0}
.hm-rule{width:120px;height:1px;background:var(--rule);margin:3rem auto}
.hm-sub{font-size:1.15rem;font-style:italic;color:var(--paper-dim);max-width:54ch;margin:0 auto;line-height:1.5}
.hm-meta{margin-top:2.4rem;font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-dim);display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.hm-dot{opacity:.5}
.home-manuscript .featured-row{margin-top:8rem;width:100%}

/* ── home: window ── */
.home-window{position:relative;margin:-3rem calc(-1*var(--gut)) 0;padding:0 var(--gut)}
.hw-bg{position:absolute;inset:0;overflow:hidden}
.hw-bg img{width:100%;height:100%;object-fit:cover;filter:saturate(.7) brightness(.55)}
.hw-shade{position:absolute;inset:0;background:linear-gradient(180deg, rgba(20,28,22,.4) 0%, rgba(20,28,22,.85) 90%)}
.hw-text{position:relative;z-index:1;padding:18vh var(--gut) 14vh;max-width:1100px;margin:0 auto}
.hw-eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:1.4rem}
.hw-text h1{font-size:clamp(2.6rem,7vw,6rem);font-weight:400;line-height:1.02;letter-spacing:-.02em;text-wrap:balance;font-style:italic;max-width:14ch}
.hw-cta{display:flex;gap:1rem;margin-top:3rem;flex-wrap:wrap}

/* ── featured row (shared by all home variants) ── */
.featured-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);position:relative;z-index:2;background:var(--forest)}
.fr-card{padding:2rem 2rem 1.6rem;border-right:1px solid var(--rule);transition:background .35s}
.fr-card:last-child{border-right:0}
.fr-card:hover{background:var(--forest-mid)}
.fr-eyebrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-dim);margin-bottom:1.2rem}
.fr-card h3{font-size:1.4rem;font-weight:400;line-height:1.2;margin-bottom:.6rem;text-wrap:balance}
.fr-card p{color:var(--paper-dim);font-size:.95rem;line-height:1.45;font-style:italic}
.fr-foot{margin-top:1.6rem;font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

/* ── about ── */
.about-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:5rem}
.about-text{font-size:1.15rem;line-height:1.65}
.about-text .lead{font-size:1.4rem;font-style:italic;line-height:1.4;margin-bottom:1.6rem;color:var(--paper)}
.about-text p+p{margin-top:1.2rem}
.about-aside{display:flex;flex-direction:column;gap:2.4rem}
.about-portrait{}
.about-portrait img{width:100%;aspect-ratio:4/5;object-fit:cover;filter:saturate(.9)}
.about-portrait figcaption{margin-top:.6rem;font-family:var(--mono);font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim)}
.lineage{padding-top:1.4rem;border-top:1px solid var(--rule)}
.ln-h{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:.8rem}
.lineage ul{list-style:none;font-size:.98rem;line-height:1.6}
.lineage li{padding:.2rem 0;color:var(--paper-dim)}

/* ── writing ── */
.writing-filter{display:flex;gap:.6rem;margin-bottom:2.4rem}
.wf{font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;padding:.5rem .9rem;border:1px solid var(--rule);color:var(--paper-dim);transition:all .25s}
.wf:hover{color:var(--paper)}
.wf.is-on{background:var(--paper);color:var(--forest);border-color:var(--paper)}
.essays{list-style:none}
.essay-row{display:grid;grid-template-columns:120px 1fr 80px 30px;gap:2rem;align-items:start;padding:1.8rem 0;border-bottom:1px solid var(--rule);transition:background .25s, padding .25s}
.essay-row:hover{background:var(--forest-mid);padding-left:1rem;padding-right:1rem}
.er-date{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;color:var(--paper-dim);padding-top:.4rem}
.er-body{display:flex;flex-direction:column;gap:.3rem}
.er-title{font-size:1.5rem;line-height:1.2;letter-spacing:-.005em}
.er-dek{font-style:italic;color:var(--paper-dim);font-size:1rem}
.er-min{font-family:var(--mono);font-size:.7rem;color:var(--paper-dim);text-align:right;padding-top:.5rem}
.er-arrow{font-family:var(--mono);font-size:1rem;color:var(--gold);text-align:right;padding-top:.4rem;transition:transform .25s}
.essay-row:hover .er-arrow{transform:translate(4px,-4px)}

/* ── essay reader ── */
.essay-page{max-width:760px}
.back{font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim);display:inline-block;margin-bottom:3rem}
.back:hover{color:var(--paper)}
.ep-head{margin-bottom:2.4rem}
.ep-meta{font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim);display:flex;gap:.8rem;margin-bottom:1.4rem}
.ep-head h1{font-size:clamp(2rem,4.4vw,3.4rem);font-weight:400;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.ep-dek{font-size:1.3rem;font-style:italic;color:var(--paper-dim);margin-top:1rem;line-height:1.4}
.ep-rule{display:flex;justify-content:center;margin:2.4rem 0;color:var(--gold);opacity:.6}
.ep-rule svg{width:32px;height:42px}
.ep-body p{font-size:1.2rem;line-height:1.7;margin-bottom:1.4rem}
.ep-body p:first-child::first-letter{font-size:3.4em;float:left;line-height:.85;padding:.1em .12em 0 0;color:var(--gold);font-style:italic}
.ep-foot{margin-top:4rem;padding-top:2rem;border-top:1px solid var(--rule);display:flex;justify-content:space-between;font-style:italic;color:var(--paper-dim)}
.ep-foot-loc{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-style:normal}

/* ── teachings ── */
.talks{list-style:none;border-top:1px solid var(--rule)}
.talk{display:grid;grid-template-columns:60px 1fr 100px;gap:1.6rem;align-items:center;padding:1.6rem 0;border-bottom:1px solid var(--rule)}
.talk.is-on{background:var(--forest-mid)}
.play{width:46px;height:46px;border-radius:50%;border:1px solid var(--paper-dim);display:flex;align-items:center;justify-content:center;transition:all .25s;margin-left:.4rem}
.play:hover{border-color:var(--gold);color:var(--gold)}
.talk.is-on .play{background:var(--gold);border-color:var(--gold);color:var(--forest)}
.tri{display:block;width:0;height:0;border-left:10px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.pause{display:flex;gap:3px}
.pause i{display:block;width:3px;height:14px;background:currentColor}
.talk-meta{font-family:var(--mono);font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim);display:flex;gap:.6rem;margin-bottom:.3rem}
.talk-dot{opacity:.5}
.talk-title{font-size:1.3rem;line-height:1.25;margin-bottom:.6rem}
.talk-bar{position:relative;height:2px;background:var(--rule);border-radius:1px;overflow:visible}
.talk-bar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--gold);transition:width .1s linear}
.talk-bar-tick{position:absolute;top:50%;width:8px;height:8px;background:var(--gold);border-radius:50%;transform:translate(-50%,-50%);transition:left .1s linear}
.talk-time{font-family:var(--mono);font-size:.78rem;color:var(--paper-dim);text-align:right}
.now-playing{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--forest-deep);border:1px solid var(--rule);padding:.9rem 1.4rem;display:flex;align-items:center;gap:1.6rem;z-index:60;box-shadow:0 12px 40px rgba(0,0,0,.5);min-width:420px;max-width:90vw}
.np-l{display:flex;align-items:center;gap:1rem;flex:1}
.np-pulse{display:flex;gap:2px;align-items:flex-end;height:18px}
.np-pulse span{display:block;width:2px;background:var(--gold);animation:pulse 1.2s infinite ease-in-out}
.np-pulse span:nth-child(1){height:60%;animation-delay:0s}
.np-pulse span:nth-child(2){height:100%;animation-delay:.2s}
.np-pulse span:nth-child(3){height:40%;animation-delay:.4s}
@keyframes pulse{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.np-t{font-size:1rem;line-height:1.2}
.np-s{font-family:var(--mono);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-dim);margin-top:.2rem}
.np-stop{font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim);padding:.5rem .8rem;border:1px solid var(--rule)}
.np-stop:hover{color:var(--paper);border-color:var(--paper)}

/* ── schedule ── */
.retreats{list-style:none}
.retreat{display:grid;grid-template-columns:200px 1fr 180px 120px;gap:2rem;align-items:start;padding:2rem 0;border-bottom:1px solid var(--rule);transition:background .25s,padding .25s}
.retreat:hover{background:var(--forest-mid);padding-left:1rem}
.re-when{font-family:var(--mono);font-size:.78rem;letter-spacing:.12em;color:var(--gold);padding-top:.4rem;line-height:1.4}
.re-title{font-size:1.4rem;line-height:1.25;margin-bottom:.4rem;text-wrap:balance}
.re-where{font-style:italic;color:var(--paper-dim);margin-bottom:.3rem}
.re-kind{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-dim)}
.re-status{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:.6rem;padding-top:.4rem}
.re-status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.status-waitlist .re-status-dot{background:var(--rust)}
.status-few-spots .re-status-dot{background:var(--rust);animation:blink 2s infinite}
.status-ongoing .re-status-dot{background:var(--paper-dim)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.re-cta{font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--paper);padding:.6rem .9rem;border:1px solid var(--rule);text-align:center;align-self:start;margin-top:.2rem;transition:all .25s}
.re-cta:hover{background:var(--paper);color:var(--forest);border-color:var(--paper)}

/* ── books ── */
.books-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3rem}
.book{display:flex;flex-direction:column;gap:1.4rem}
.book-cover{aspect-ratio:2/3;position:relative;display:flex;align-items:center;justify-content:center;padding:2rem;color:#f0e9d6;box-shadow:8px 8px 0 rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.08);transition:transform .3s}
.book:hover .book-cover{transform:translate(-4px,-4px);box-shadow:12px 12px 0 rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.08)}
.book-cover-inner{text-align:center}
.book-rule{width:40px;height:1px;background:rgba(255,255,255,.4);margin:0 auto 1.4rem}
.book-title{font-size:1.6rem;line-height:1.15;margin-bottom:.6rem;font-style:italic}
.book-sub{font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;opacity:.7;line-height:1.5;margin-bottom:2rem}
.book-author{font-family:var(--mono);font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;opacity:.85}
.book-forth{position:absolute;top:1rem;right:1rem;font-family:var(--mono);font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;background:rgba(0,0,0,.3);padding:.3rem .5rem}
.book-meta{padding-top:.6rem;border-top:1px solid var(--rule)}
.book-year{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;color:var(--gold);margin-bottom:.4rem}
.book-name{font-size:1.2rem;margin-bottom:.2rem}
.book-sub2{font-style:italic;color:var(--paper-dim);font-size:.95rem;line-height:1.4}
.book-cover-img{width:100%;height:100%;object-fit:cover;display:block}
.book-buy{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
.book-buy-link{font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(210,163,92,.35);padding:.3rem .6rem;transition:background .2s,color .2s}
.book-buy-link:hover{background:var(--gold);color:var(--forest)}
.books-note{margin-top:4rem;padding-top:2rem;border-top:1px solid var(--rule);font-style:italic;color:var(--paper-dim);font-size:1.1rem;text-align:center}

/* ── pilgrimages ── */
.pilg-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.4rem;grid-auto-rows:minmax(0,auto)}
.pilg-img{position:relative;overflow:hidden}
.pilg-img img{width:100%;height:100%;object-fit:cover;filter:saturate(.92)}
.pilg-img figcaption{position:absolute;bottom:.6rem;left:.8rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:#f5efdc;background:rgba(0,0,0,.4);padding:.3rem .5rem}
.pilg-tall{grid-row:span 2;aspect-ratio:3/5}
.pilg-wide{aspect-ratio:5/4}
.pilg-text{padding:1rem 0;font-size:1.1rem;line-height:1.6}
.pilg-text h3{font-size:1.6rem;font-weight:400;margin-bottom:1rem;font-style:italic;color:var(--gold)}
.pilg-text p+p{margin-top:1rem}
.pilg-cta{padding:2rem;background:var(--forest-mid);border:1px solid var(--rule);display:flex;flex-direction:column;justify-content:center;gap:.5rem}
.pilg-cta-h{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.pilg-cta-d{font-size:1.4rem;font-style:italic}
.pilg-cta-w{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;color:var(--paper-dim);margin-bottom:1.2rem}

/* ── contact ── */
.contact-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:5rem}
.contact-text p{font-size:1.2rem;line-height:1.6;font-style:italic;color:var(--paper-dim);margin-bottom:2.4rem}
.contact-direct{display:flex;flex-direction:column;gap:1rem;border-top:1px solid var(--rule);padding-top:1.6rem}
.cd-row{display:flex;gap:1rem;align-items:baseline;font-size:1rem}
.cd-row span{font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim);width:90px}
.cd-row a:hover{color:var(--gold)}
.contact-form{display:flex;flex-direction:column;gap:1.4rem}
.contact-form label{display:flex;flex-direction:column;gap:.5rem}
.contact-form span{font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim)}
.contact-form input,.contact-form select,.contact-form textarea{font-family:var(--serif);font-size:1.1rem;background:transparent;border:0;border-bottom:1px solid var(--rule);color:var(--paper);padding:.6rem 0;transition:border-color .25s}
.contact-form input:focus,.contact-form textarea:focus,.contact-form select:focus{outline:0;border-bottom-color:var(--gold)}
.contact-form select{cursor:pointer}
.contact-form select option{background:var(--forest-deep)}
.contact-form textarea{resize:vertical;font-style:italic}
.contact-form.sent{align-items:center;text-align:center;padding:3rem 1rem;border:1px solid var(--rule);justify-content:center}
.ok-mark{width:60px;height:60px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:1.4rem}
.contact-form.sent h3{font-size:1.8rem;font-weight:400;font-style:italic;margin-bottom:.8rem}
.contact-form.sent p{color:var(--paper-dim);font-style:italic;line-height:1.5}

/* ── buttons ── */
.btn{display:inline-block;font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;padding:.9rem 1.4rem;border:1px solid var(--paper);color:var(--paper);transition:all .25s;background:transparent;align-self:flex-start}
.btn:hover{background:var(--paper);color:var(--forest)}
.btn.ghost{border-color:var(--rule);color:var(--paper-dim)}
.btn.ghost:hover{border-color:var(--paper);background:transparent;color:var(--paper)}

/* ── footer ── */
.site-footer{display:grid;grid-template-columns:repeat(4,1fr);gap:3rem;padding:5rem var(--gut) 3rem;border-top:1px solid var(--rule);margin-top:5rem;font-size:.95rem}
.ft-h{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:1rem}
.ft-col{display:flex;flex-direction:column;gap:.4rem}
.ft-col a:hover{color:var(--gold)}
.ft-meta{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;color:var(--paper-dim);text-transform:uppercase}

/* ── tweaks panel content ── */
.tw-hint{font-size:.78rem;color:var(--paper-dim);font-style:italic;margin-top:.6rem;line-height:1.4}

/* ── responsive ── */
@media (max-width: 1180px){
  .nav-link{font-size:.66rem;letter-spacing:.12em}
  .nav{gap:1rem}
  .nav-num{display:none}
  .he-photo{width:38vw}
  .he-manifesto{margin-top:min(40vh,440px)}
}
@media (max-width: 900px){
  .nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--forest-deep);padding:1rem var(--gut);gap:1rem;border-bottom:1px solid var(--rule)}
  .nav-open{display:flex}
  .nav-toggle{display:flex}
  .he-photo{position:relative;width:100%;max-width:100%}
  .he-manifesto{margin-top:2rem}
  .he-leaf{display:none}
  .featured-row{grid-template-columns:1fr}
  .fr-card{border-right:0;border-bottom:1px solid var(--rule)}
  .about-grid,.contact-grid{grid-template-columns:1fr;gap:3rem}
  .essay-row{grid-template-columns:1fr 30px;gap:.4rem}
  .er-date,.er-min{grid-column:1;font-size:.65rem}
  .retreat{grid-template-columns:1fr;gap:.6rem}
  .books-grid{grid-template-columns:1fr 1fr}
  .pilg-grid{grid-template-columns:1fr 1fr}
  .pilg-tall{grid-row:auto;aspect-ratio:3/4}
  .site-footer{grid-template-columns:1fr 1fr}
  .now-playing{min-width:auto;width:90vw}
}
</style>
</head>
